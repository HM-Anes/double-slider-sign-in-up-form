<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- Render all elements normally  -->
        <link rel="stylesheet" href="CSS/normalize.css" />
        <!-- Font awsome library -->
        <link rel="stylesheet" href="CSS/all.min.css" />
        <!-- main template style -->
        <link rel="stylesheet" href="CSS/style.css" />
        <!-- google fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cairo:wght@200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
            rel="stylesheet"
        />
        <title>Sign up</title>
    </head>
    <body class="flex">
        <!-- container -->
        <div class="container flex" id="container">
            <!-- Sign-in section -->
            <div class="sign-overlay sign-in-overlay flex">
                <!-- Sign-in content -->
                <div class="content-sign content-sign-in flex">
                    <h1>Welcome Back!</h1>
                    <p>
                        To keep connected with us please login with your
                        personal info
                    </p>
                    <!-- sign in button -->
                    <button type="button" class="switch" id="signIn">
                        sign in
                    </button>
                </div>
            </div>

            <!-- Form up-section -->
            <form action="#" class="flex sign-up">
                <!-- Form content -->
                <div class="content-form content-up flex">
                    <h1>Create Account</h1>
                    <div class="links flex">
                        <!-- facebook -->
                        <button
                            type="button"
                            aria-label="Sign up with Facebook"
                        >
                            <i class="fa-brands fa-facebook-f"></i>
                        </button>
                        <!-- google -->
                        <button type="button" aria-label="Sign up with Google">
                            <i class="fa-brands fa-google-plus-g"></i>
                        </button>
                        <!-- linked in -->
                        <button
                            type="button"
                            aria-label="Sign up with LinkedIn"
                        >
                            <i class="fa-brands fa-linkedin-in"></i>
                        </button>
                    </div>
                    <div class="input-fields flex">
                        <p>or use your email for registration</p>
                        <!-- Name -->
                        <input type="text" placeholder="Name" />
                        <!-- Email -->
                        <input type="email" placeholder="Email" />
                        <!-- Password -->
                        <input type="password" placeholder="Password" />
                        <!-- sign up button -->
                        <button type="submit">sign up</button>
                    </div>
                </div>
            </form>

            <!-- Form in-section -->
            <form action="#" class="flex sign-in">
                <!-- Form content -->
                <div class="content-form content-in flex">
                    <h1>Sign in</h1>
                    <div class="links flex">
                        <!-- facebook -->
                        <button
                            type="button"
                            aria-label="Sign up with Facebook"
                        >
                            <i class="fa-brands fa-facebook-f"></i>
                        </button>
                        <!-- google -->
                        <button type="button" aria-label="Sign up with Google">
                            <i class="fa-brands fa-google-plus-g"></i>
                        </button>
                        <!-- linked in -->
                        <button
                            type="button"
                            aria-label="Sign up with LinkedIn"
                        >
                            <i class="fa-brands fa-linkedin-in"></i>
                        </button>
                    </div>
                    <div class="input-fields flex">
                        <p>or use your account</p>
                        <!-- Email -->
                        <input type="email" placeholder="Email" />
                        <!-- Password -->
                        <input type="password" placeholder="Password" />
                        <!-- forgot the password -->
                        <a href="http://">Forgot you password?</a>
                        <!-- sign up button -->
                        <button type="submit">sign in</button>
                    </div>
                </div>
            </form>

            <!-- Sign-in section -->
            <div class="sign-overlay sign-up-overlay flex">
                <div class="content-sign content-sign-up flex">
                    <h1>Hello friend!</h1>
                    <p>Enter your personal details and start journy with us</p>
                    <!-- sign in button -->
                    <button type="button" class="switch" id="signUp">
                        sign up
                    </button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
